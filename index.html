<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comlynk</title>
    <meta name="robots" content="noindex" />

    <link rel="alternate" hreflang="fr" href="https://kesprit.github.io/comlynk/fr/" />
    <link rel="alternate" hreflang="en" href="https://kesprit.github.io/comlynk/en/" />
    <link rel="alternate" hreflang="x-default" href="https://kesprit.github.io/comlynk/" />
    <link rel="icon" href="favicon.png" sizes="32x32" />

    <!-- Aiguillage de langue : la langue déjà choisie l'emporte, sinon on suit
         le navigateur. Tout le reste du site est du HTML statique. -->
    <script>
      (function () {
        var target = "en/";

        try {
          var saved = window.localStorage.getItem("comlynk-lang");
          if (saved === "fr" || saved === "en") {
            window.location.replace(saved + "/");
            return;
          }
        } catch (error) {
          /* Stockage bloqué : on retombe sur la langue du navigateur. */
        }

        var preferred = navigator.languages || [navigator.language || "en"];

        for (var i = 0; i < preferred.length; i++) {
          if (String(preferred[i]).toLowerCase().indexOf("fr") === 0) {
            target = "fr/";
            break;
          }
        }

        window.location.replace(target);
      })();
    </script>

    <noscript><meta http-equiv="refresh" content="0; url=en/" /></noscript>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 18px;
        background: #fdf6f0;
        color: #0f0d0c;
        font: 500 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        text-align: center;
      }
      a {
        color: #c13a14;
      }
    </style>
  </head>

  <body>
    <p>
      <strong>Comlynk</strong><br />
      <a href="fr/" hreflang="fr">Français</a> · <a href="en/" hreflang="en">English</a>
    </p>
  </body>
</html>
